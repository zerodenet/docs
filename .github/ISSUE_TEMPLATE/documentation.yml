name: 文档问题
description: 报告公开文档内容、文档站或文档仓库维护问题
title: "docs: "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        本仓库只处理文档内容、文档站和文档仓库维护问题。
        程序行为、运行错误和功能实现问题请提交到对应项目仓库。
  - type: dropdown
    id: kind
    attributes:
      label: 问题类型
      options:
        - 文档内容
        - 文档站
        - 仓库维护 / CI
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: 文档范围
      description: 选择受影响的文档区域，而不是软件 Issue 的归属。
      options:
        - Zero Core 文档
        - ZNet Sink 文档
        - Zboard 文档
        - Community
        - 公共页面 / 导航
        - Repository / CI
        - 其他
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 页面地址
      description: 如果问题对应具体页面或章节，请提供地址。
  - type: textarea
    id: problem
    attributes:
      label: 当前问题
      description: 说明文档内容、站点或仓库维护方面存在的问题。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 版本与证据
      description: 如果问题涉及文档与实现不一致，请提供相关版本、日志或实现链接。
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 说明希望文档或文档站如何调整。
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 敏感信息
      options:
        - label: 我已移除配置、订阅地址、凭据、Token 和其他敏感信息。
          required: true
