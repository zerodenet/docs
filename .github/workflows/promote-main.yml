name: Promote develop to main

on:
  workflow_dispatch:
    inputs:
      release_pr:
        description: Open develop -> main release PR number
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: promote-main
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch release branches
        run: git fetch origin main develop --no-tags

      - name: Validate release PR and branch state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release_pr }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$RELEASE_PR" =~ ^[0-9]+$ ]]; then
            echo "release_pr must be a pull request number." >&2
            exit 1
          fi

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$RELEASE_PR")"
          state="$(jq -r '.state' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"

          if [ "$state" != "open" ]; then
            echo "Release PR #$RELEASE_PR must be open." >&2
            exit 1
          fi

          if [ "$base_ref" != "main" ] || [ "$head_ref" != "develop" ]; then
            echo "Release PR #$RELEASE_PR must be develop -> main." >&2
            exit 1
          fi

          if [ "$head_repo" != "$REPOSITORY" ]; then
            echo "Release PR #$RELEASE_PR must use this repository's develop branch." >&2
            exit 1
          fi

          develop_sha="$(git rev-parse origin/develop)"
          main_sha="$(git rev-parse origin/main)"

          if [ "$head_sha" != "$develop_sha" ]; then
            echo "Release PR head ($head_sha) does not match current develop ($develop_sha)." >&2
            echo "Refresh or recreate the release PR before promoting." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$main_sha" "$develop_sha"; then
            echo "main is not an ancestor of develop; fast-forward promotion is unsafe." >&2
            echo "Reconcile develop with main before retrying." >&2
            exit 1
          fi

          if [ "$main_sha" = "$develop_sha" ]; then
            echo "main already points to the current develop commit." >&2
            exit 1
          fi

          echo "develop_sha=$develop_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Checkout release candidate
        run: git checkout --detach "${{ steps.release.outputs.develop_sha }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release candidate
        run: pnpm check:build

      - name: Recheck develop and fast-forward main
        env:
          EXPECTED_DEVELOP_SHA: ${{ steps.release.outputs.develop_sha }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main develop --no-tags
          current_develop_sha="$(git rev-parse origin/develop)"
          current_main_sha="$(git rev-parse origin/main)"

          if [ "$current_develop_sha" != "$EXPECTED_DEVELOP_SHA" ]; then
            echo "develop changed while the release was being validated; aborting." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$current_main_sha" "$EXPECTED_DEVELOP_SHA"; then
            echo "main changed and is no longer an ancestor of the validated develop commit; aborting." >&2
            exit 1
          fi

          git push origin "$EXPECTED_DEVELOP_SHA:refs/heads/main"

      - name: Publish summary
        run: |
          {
            echo "## Promotion complete"
            echo
            echo "- release PR: #${{ inputs.release_pr }}"
            echo "- main: \`${{ steps.release.outputs.main_sha }}\` -> \`${{ steps.release.outputs.develop_sha }}\`"
            echo "- method: fast-forward"
          } >> "$GITHUB_STEP_SUMMARY"
